# Isolated Docker build verification for the Gola backend image.
# Build ONLY: no registry push, no credentials, no production access.
# Trigger: pushes to check/docker-build or manual dispatch.
name: docker-build-check

on:
  push:
    branches: [check/docker-build]
  workflow_dispatch:

# Least privilege: read the repo, nothing else. No packages:write (no push),
# no secrets of any kind.
permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA verified 2026-10-17)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 (SHA verified 2026-10-17)
      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (SHA verified 2026-10-17)
        with:
          context: .
          push: false
          load: true
          tags: gola-backend:check
      - name: Smoke test - boot as non-root, maintenance gate on
        run: |
          set -euo pipefail
          docker run -d --name gola-check -p 8787:8787 \
            -e GOLA_MAINTENANCE=1 -e PORT=8787 \
            gola-backend:check
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/health || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          echo "GET /health -> $code"
          test "$code" = "200"
          acode=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8787/actions \
            -H 'Content-Type: application/json' -d '{"action":"noop","params":{}}' || true)
          echo "POST /actions -> $acode (expect 503, maintenance on)"
          test "$acode" = "503"
          who=$(docker exec gola-check whoami)
          echo "container user -> $who (expect bun, L3)"
          test "$who" = "bun"
      - name: Cleanup
        if: always()
        run: docker rm -f gola-check >/dev/null 2>&1 || true
